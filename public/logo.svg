<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="g1" x1="20" y1="70" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#008387"/>
      <stop offset="1" stop-color="#0a6b6e"/>
    </linearGradient>
    <linearGradient id="g2" x1="26" y1="32" x2="54" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#143562"/>
      <stop offset="1" stop-color="#1a4a8a"/>
    </linearGradient>
  </defs>
  <!-- Bottom chevron (teal gradient) -->
  <polygon points="20,70 60,70 40,40" fill="url(#g1)"/>
  <!-- Top chevron (navy gradient) -->
  <polygon points="26,32 54,32 40,10" fill="url(#g2)"/>
  <!-- Highlight accent — subtle glass reflection -->
  <polygon points="33,28 47,28 40,16" fill="white" opacity="0.12"/>
  <!-- Right edge highlight -->
  <polygon points="40,10 54,32 47,28" fill="white" opacity="0.06"/>
</svg>
