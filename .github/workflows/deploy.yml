name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run

  e2e-tests:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build static export
        run: ./scripts/build-static.sh
      - name: Install Playwright browsers
        # Runner DNS is occasionally flaky (transient 'Temporary failure
        # resolving security.ubuntu.com'); apt's own retry handles it.
        run: |
          sudo apt-get update -o Acquire::Retries=5
          npx playwright install --with-deps chromium
      - name: Start server and run E2E tests
        run: |
          npx serve out -l 3000 &
          SERVER_PID=$!
          sleep 3
          npx playwright test --reporter=html
          E2E_EXIT=$?
          kill $SERVER_PID 2>/dev/null
          exit $E2E_EXIT
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Build static export
        run: ./scripts/build-static.sh
      - name: Deploy to Cloudflare Workers (assets-only; wrangler.jsonc)
        # wrangler-action@v3 installs wrangler 3.x by default, which cannot deploy
        # an assets-only Worker (no `main` entry-point). Call the v4 CLI directly.
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Non-secret; wrangler.jsonc omits account_id (local deploys use the
          # wrangler OAuth profile, CI needs it explicit).
          CLOUDFLARE_ACCOUNT_ID: f94ced49d897e59303c8e1f292985182
